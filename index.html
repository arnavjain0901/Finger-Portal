<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finger Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <video id="video" autoplay playsinline></video>

        <canvas id="canvas"></canvas>

        <div id="ui">

    <h1>FINGER PORTAL</h1>

    <div class="system-line">
        <span class="dot"></span>
        <span>SYSTEM</span>
        <strong id="systemStatus">ONLINE</strong>
    </div>

    <div class="hud-line">
        <span>HANDS</span>
        <strong id="handCount">0 / 2</strong>
    </div>

    <div class="hud-line">
        <span>POINTS</span>
        <strong id="pointCount">0 / 4</strong>
    </div>

    <div class="hud-line">
        <span>PORTAL</span>
        <strong id="portalStatus">SEARCHING</strong>
    </div>

    <div class="hud-divider"></div>

    <div class="filter-label">
        ACTIVE FILTER
    </div>

    <div id="filterName">
        GRID
    </div>

    <p id="status" class="status-message">
        Show both hands
    </p>

    <div class="hud-divider"></div>

    <p class="hint">
        <b>F</b> CHANGE FILTER
        <br>
        <b>Q</b> STOP CAMERA
    </p>

</div>

    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="script.js"></script>

</body>
</html>
